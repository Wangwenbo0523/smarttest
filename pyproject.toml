[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "smarttest"
dynamic = ["version"]
description = "接口契约驱动的测试用例智能生成与失败归因平台"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Wangwenbo0523" }]
keywords = ["testing", "openapi", "contract-testing", "pytest", "test-generation", "llm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "httpx>=0.27",
  "Jinja2>=3.1",
  "PyYAML>=6.0",
  "pydantic>=2.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
smarttest = "smarttest.cli:main"

[project.urls]
Repository = "https://github.com/Wangwenbo0523/smarttest"

[tool.setuptools]
packages = ["smarttest", "smarttest.semantic"]

[tool.setuptools.package-data]
smarttest = ["templates/*.j2"]

[tool.setuptools.dynamic]
version = { attr = "smarttest.__version__" }

[tool.coverage.run]
source = ["smarttest"]
# 编排层（启动靶场、调 pytest、写报告）由 CI 的端到端门禁覆盖：
# 那些门禁真起服务、真跑测试。单测覆盖率口径里不算它们，
# 否则数字会被「拉起子进程」这类代码稀释，反而看不出规则层的真实质量。
omit = [
  "smarttest/pipeline.py",
  "smarttest/evaluation.py",
  # 模板是 Jinja2 渲染时才编译成 Python 的，coverage 会把编译产物算进来。
  # 模板正确性由生成器单测 + 端到端门禁保证，不计入单测覆盖率口径。
  "smarttest/templates/*",
]

[tool.coverage.report]
show_missing = true
exclude_also = [
  "if __name__ == .__main__.:",
  "raise SystemExit",
]
