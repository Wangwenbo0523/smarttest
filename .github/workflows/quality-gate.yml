name: 质量门禁

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: 质量门禁
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      # 这一条是「规则本身有没有被改坏」：上面几道门禁看的是汇总结论
      # （几个缺陷、召回多少），这里逐条钉住取值构造与边界规则。
      - name: 规则引擎单元测试
        run: python -m pytest -q

      # 这一条是「测试不许变少」：实测核心模块覆盖率 98%
      # （编排层与 Jinja2 模板不计入口径，它们由下面的端到端门禁覆盖）。
      # 阈值取 95，留一点余量给不同 Python 版本的语句差异，但足以拦住明显回退。
      - name: 单元测试覆盖率门禁
        run: python -m pytest -q --cov=smarttest --cov-report=term-missing --cov-fail-under=95

      # 这一条是「能不能发现问题」：靶场注入了 3 个缺陷，
      # 补全覆盖后又暴露出 1 处契约漂移，所以期望命中 4 个。
      # 数量对不上说明规则引擎漏了或误报了。
      - name: 缺陷检出（期望命中 4 个真实缺陷）
        run: python run_demo.py --target-mode buggy --expect-defects 4 --report-tag buggy

      # 这一条是「是不是误报」：同一套用例打到已修复的靶场上，
      # 必须一个缺陷都报不出来。误报率是这类工具能不能落地的分水岭。
      - name: 零误报自证（修复版应报 0 个缺陷）
        run: python run_demo.py --target-mode fixed --expect-defects 0 --report-tag fixed

      # 这一条是「生成质量」：召回率 = 该测的有没有测到，
      # 精确率 = 生成的是不是都该测。低于 100% 直接卡住。
      - name: 用例生成质量门禁
        run: python run_evals.py --min-recall 100 --min-precision 100

      # 下面三条跑的是**第二靶场**（用户与订阅服务），契约形态与订单服务刻意不同：
      # 有必填请求头、有枚举与布尔字段、路径参数下界大于 1。
      # 只在一个契约上跑通说明不了通用性 —— 换一份契约还成立，才是证据。
      - name: 第二靶场 · 缺陷检出（期望命中 3 个真实缺陷）
        run: python run_demo.py --target users --port 8124 --target-mode buggy --expect-defects 3 --report-tag users-buggy

      - name: 第二靶场 · 零误报自证（修复版应报 0 个缺陷）
        run: python run_demo.py --target users --port 8124 --target-mode fixed --expect-defects 0 --report-tag users-fixed

      - name: 第二靶场 · 用例生成质量门禁
        run: python run_evals.py --target users --min-recall 100 --min-precision 100

      # 第三靶场（内容服务）补的是前两个靶场没有的形态：查询参数、嵌套对象、
      # 数组字段、Bearer 认证头。它照出的缺口是「query 参数整块不覆盖」——
      # 不换形态，这个洞会一直安静地留在那里。
      - name: 第三靶场 · 缺陷检出（期望命中 3 个真实缺陷）
        run: python run_demo.py --target articles --port 8125 --target-mode buggy --expect-defects 3 --report-tag articles-buggy

      - name: 第三靶场 · 零误报自证（修复版应报 0 个缺陷）
        run: python run_demo.py --target articles --port 8125 --target-mode fixed --expect-defects 0 --report-tag articles-fixed

      - name: 第三靶场 · 用例生成质量门禁
        run: python run_evals.py --target articles --min-recall 100 --min-precision 100

      # 这一条是「模型能不能被信任」：验证幻觉拦截与降级机制。
      # 用内置的假模型服务，不需要任何 API Key。
      - name: 语义增强层通路与幻觉拦截
        run: python tools/verify_semantic.py

      # 这一条是「演示界面是不是另写一套」：真把演示服务拉起来走 HTTP，
      # 断言界面拿到的数据与命令行结论一致。同样不需要 API Key。
      - name: 演示界面通路（界面与流水线一致）
        run: python tools/verify_demo.py

      - name: 上传质量报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: build/reports/
          retention-days: 14
